[project]
name = "kiosk"
  version = "0.1.0"
  description = "Makerspace access kiosk core"
  requires-python = ">=3.13"
  dependencies = []

  [dependency-groups]
  dev = [
      "pytest",
      "ruff",
      "pyright",
  ]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

packages = ["kiosk"]

[tool.ruff]
  target-version = "py313"
  line-length = 100

[tool.ruff.lint]
  select = [
      "E",    # pycodestyle errors (whitespace, indentation)
      "W",    # pycodestyle warnings (trailing whitespace!)
      "F",    # pyflakes (unused imports, undefined/redefined names)
      "I",    # isort (import ordering)
      "UP",   # pyupgrade (flags outdated idioms for your Python version)
      "B",    # bugbear (likely-bug patterns, e.g. mutable default args)
      "SIM",  # simplify (needlessly convoluted code)
  ]

[tool.pyright]
  pythonVersion = "3.13"
  typeCheckingMode = "standard"
  include = ["kiosk", "tests"]

